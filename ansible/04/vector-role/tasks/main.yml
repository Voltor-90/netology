---
- name: Ensure Vector service group exists
  ansible.builtin.group:
    name: "{{ vector_service_group }}"
    system: true

- name: Ensure Vector service user exists
  ansible.builtin.user:
    name: "{{ vector_service_user }}"
    group: "{{ vector_service_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ vector_data_dir }}"
    create_home: false

- name: Ensure Vector directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vector_install_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ vector_config_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ vector_data_dir }}", owner: "{{ vector_service_user }}", group: "{{ vector_service_group }}", mode: "0750" }

- name: Download Vector archive
  ansible.builtin.get_url:
    url: "{{ vector_download_url }}"
    dest: "{{ vector_archive_path }}"
    mode: "0644"

- name: Extract Vector archive
  ansible.builtin.unarchive:
    src: "{{ vector_archive_path }}"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ vector_binary_path }}"

- name: Link Vector binary into PATH
  ansible.builtin.file:
    src: "{{ vector_binary_path }}"
    dest: /usr/local/bin/vector
    state: link

- name: Deploy Vector configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    owner: root
    group: "{{ vector_service_group }}"
    mode: "0640"
  notify: Restart Vector

- name: Deploy Vector systemd unit
  ansible.builtin.template:
    src: vector.service.j2
    dest: "{{ vector_systemd_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Vector

- name: Ensure Vector is enabled and started
  ansible.builtin.systemd:
    name: vector
    enabled: true
    state: started
    daemon_reload: true
