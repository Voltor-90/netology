---
vector_version: "0.61.0"
vector_arch: x86_64-unknown-linux-musl
vector_download_url: "https://install.datadoghq.com/vector/{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
vector_data_dir: /var/lib/vector
vector_config_dir: /etc/vector
vector_install_dir: /opt/vector
vector_service_user: vector
vector_service_group: vector
vector_config:
  data_dir: "{{ vector_data_dir }}"
  sources:
    demo_logs:
      type: demo_logs
      format: json
      interval: 1.0
  sinks:
    console:
      type: console
      inputs:
        - demo_logs
      target: stdout
      encoding:
        codec: json
