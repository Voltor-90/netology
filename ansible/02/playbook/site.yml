---
# Play 1: Install ClickHouse

- name: Install Clickhouse
  hosts: clickhouse
  become: true

  handlers:
    - name: Start clickhouse service
      ansible.builtin.debug:
        msg: "ClickHouse packages installed"

  tasks:
    - name: Get clickhouse distrib
      ansible.builtin.get_url:
        url: >-
          https://packages.clickhouse.com/rpm/stable/{{ item }}-{{ clickhouse_version }}.{{
          (item == 'clickhouse-common-static') | ternary('x86_64', 'noarch') }}.rpm
        dest: "/tmp/{{ item }}-{{ clickhouse_version }}.rpm"
        mode: "0644"
        timeout: 120
      loop: "{{ clickhouse_packages }}"

    - name: Install clickhouse packages
      ansible.builtin.dnf:
        name:
          - "/tmp/clickhouse-common-static-{{ clickhouse_version }}.rpm"
          - "/tmp/clickhouse-client-{{ clickhouse_version }}.rpm"
          - "/tmp/clickhouse-server-{{ clickhouse_version }}.rpm"
        state: present
        disable_gpg_check: true
      notify: Start clickhouse service

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Create database logs
      ansible.builtin.command: clickhouse-client -q "create database logs;"
      register: create_db
      changed_when: create_db.rc == 0
      failed_when: create_db.rc != 0 and create_db.rc != 82
      ignore_errors: true

    - name: Cleanup rpm files
      ansible.builtin.file:
        path: "/tmp/{{ item }}-{{ clickhouse_version }}.rpm"
        state: absent
      loop: "{{ clickhouse_packages }}"

# Play 2: Install Vector

- name: Install Vector
  hosts: vector
  become: true

  handlers:
    - name: Restart Vector
      ansible.builtin.debug:
        msg: "Vector configuration changed"

  tasks:

    - name: Create vector user
      ansible.builtin.user:
        name: vector
        system: true
        state: present

    - name: Create vector directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: vector
        group: vector
        mode: "0755"
      loop:
        - "{{ vector_install_dir }}"
        - "{{ vector_config_dir }}"
        - "/var/lib/vector"
        - "/var/log/vector"

    - name: Check vector archive
      ansible.builtin.stat:
        path: "/tmp/vector-{{ vector_version }}.tar.gz"
      register: vector_archive

    - name: Download vector archive
      ansible.builtin.get_url:
        url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        mode: "0644"
        timeout: 300
        force: false
      when: not vector_archive.stat.exists

    - name: Extract vector archive
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "/tmp"
        remote_src: true
        creates: "/tmp/vector-{{ vector_arch }}-unknown-linux-gnu"

    - name: Install vector binary
      ansible.builtin.copy:
        src: "/tmp/vector-{{ vector_arch }}-unknown-linux-gnu/bin/vector"
        dest: "/usr/local/bin/vector"
        remote_src: true
        mode: "0755"

    - name: Deploy vector config
      ansible.builtin.template:
        src: vector.yaml.j2
        dest: "{{ vector_config_dir }}/vector.yaml"
        mode: "0644"
      notify: Restart Vector

    - name: Deploy vector service file
      ansible.builtin.template:
        src: vector.service.j2
        dest: "/etc/systemd/system/vector.service"
        mode: "0644"
