---
- name: Install ClickHouse
  hosts: clickhouse
  become: true
  tags:
    - clickhouse
  vars:
    clickhouse_rpm_dir: /tmp/clickhouse-rpms
    clickhouse_rpm_base_url: https://packages.clickhouse.com/rpm/stable
  handlers:
    - name: Restart ClickHouse
      ansible.builtin.systemd:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Ensure ClickHouse RPM directory exists
      ansible.builtin.file:
        path: "{{ clickhouse_rpm_dir }}"
        state: directory
        mode: "0755"

    - name: Download ClickHouse RPM packages
      ansible.builtin.get_url:
        url: "{{ clickhouse_rpm_base_url }}/{{ item }}-{{ clickhouse_version }}.{{ 'x86_64' if item == 'clickhouse-common-static' else 'noarch' }}.rpm"
        dest: "{{ clickhouse_rpm_dir }}/{{ item }}-{{ clickhouse_version }}.rpm"
        mode: "0644"
      loop: "{{ clickhouse_packages }}"
      when: not ansible_check_mode

    - name: Install ClickHouse RPM packages
      ansible.builtin.dnf:
        name:
          - "{{ clickhouse_rpm_dir }}/clickhouse-common-static-{{ clickhouse_version }}.rpm"
          - "{{ clickhouse_rpm_dir }}/clickhouse-client-{{ clickhouse_version }}.rpm"
          - "{{ clickhouse_rpm_dir }}/clickhouse-server-{{ clickhouse_version }}.rpm"
        state: present
        disable_gpg_check: true
      notify: Restart ClickHouse
      when: not ansible_check_mode

    - name: Ensure ClickHouse is enabled and started
      ansible.builtin.systemd:
        name: clickhouse-server
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Flush handlers before creating the database
      ansible.builtin.meta: flush_handlers

    - name: Create the logs database
      ansible.builtin.command:
        cmd: clickhouse-client --query 'CREATE DATABASE IF NOT EXISTS logs'
      register: clickhouse_create_database
      changed_when: false
      when: not ansible_check_mode

- name: Install and configure Vector
  hosts: vector
  become: true
  tags:
    - vector
  vars:
    vector_archive: "/tmp/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
    vector_extracted_binary: "/opt/vector/vector-{{ vector_arch }}/bin/vector"
  handlers:
    - name: Restart Vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
        daemon_reload: true
      when: not ansible_check_mode
  tasks:
    - name: Ensure Vector service group exists
      ansible.builtin.group:
        name: vector
        system: true

    - name: Ensure Vector service user exists
      ansible.builtin.user:
        name: vector
        group: vector
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/vector
        create_home: false

    - name: Ensure Vector directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/vector, owner: root, group: root, mode: "0755" }
        - { path: /etc/vector, owner: root, group: root, mode: "0755" }
        - { path: /var/lib/vector, owner: vector, group: vector, mode: "0750" }

    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "{{ vector_download_url }}"
        dest: "{{ vector_archive }}"
        mode: "0644"
      when: not ansible_check_mode

    - name: Extract Vector archive
      ansible.builtin.unarchive:
        src: "{{ vector_archive }}"
        dest: /opt/vector
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: "{{ vector_extracted_binary }}"
      when: not ansible_check_mode

    - name: Link Vector binary into PATH
      ansible.builtin.file:
        src: "{{ vector_extracted_binary }}"
        dest: /usr/local/bin/vector
        state: link
      when: not ansible_check_mode

    - name: Deploy Vector configuration
      ansible.builtin.template:
        src: templates/vector.yaml.j2
        dest: /etc/vector/vector.yaml
        owner: root
        group: vector
        mode: "0640"
      notify: Restart Vector

    - name: Deploy Vector systemd unit
      ansible.builtin.template:
        src: templates/vector.service.j2
        dest: /etc/systemd/system/vector.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Vector

    - name: Ensure Vector is enabled and started
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
