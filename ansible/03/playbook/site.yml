---
- name: Install ClickHouse on Ubuntu
  hosts: clickhouse
  become: true
  tags:
    - clickhouse
  vars:
    clickhouse_key_url: "{{ clickhouse_repository_key_url }}"
    clickhouse_key_source: /tmp/clickhouse-key.gpg
    clickhouse_keyring: /usr/share/keyrings/clickhouse-keyring.gpg
    clickhouse_repository: "deb [signed-by={{ clickhouse_keyring }} arch=amd64] https://packages.clickhouse.com/deb {{ clickhouse_repository_channel }} main"
  handlers:
    - name: Restart ClickHouse
      ansible.builtin.systemd:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Install ClickHouse repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present
        update_cache: true
      when: not ansible_check_mode

    - name: Download ClickHouse signing key
      ansible.builtin.get_url:
        url: "{{ clickhouse_key_url }}"
        dest: "{{ clickhouse_key_source }}"
        mode: "0644"
      when: not ansible_check_mode

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"
      when: not ansible_check_mode

    - name: Install ClickHouse signing key
      ansible.builtin.command:
        cmd: "gpg --dearmor --yes --output {{ clickhouse_keyring }} {{ clickhouse_key_source }}"
        creates: "{{ clickhouse_keyring }}"
      when: not ansible_check_mode

    - name: Configure ClickHouse APT repository
      ansible.builtin.apt_repository:
        repo: "{{ clickhouse_repository }}"
        filename: clickhouse
        state: present
        update_cache: true
      when: not ansible_check_mode

    - name: Install ClickHouse server and client
      ansible.builtin.apt:
        name: "{{ clickhouse_packages }}"
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      notify: Restart ClickHouse
      when: not ansible_check_mode

    - name: Ensure ClickHouse is enabled and started
      ansible.builtin.systemd:
        name: clickhouse-server
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Flush ClickHouse handler before database creation
      ansible.builtin.meta: flush_handlers

    - name: Ensure logs database exists
      ansible.builtin.command:
        cmd: "clickhouse-client --query 'CREATE DATABASE IF NOT EXISTS {{ clickhouse_database }}'"
      changed_when: false
      when: not ansible_check_mode

- name: Install and configure Vector
  hosts: vector
  become: true
  tags:
    - vector
  vars:
    vector_archive: "/tmp/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
    vector_extracted_binary: "/opt/vector/vector-{{ vector_arch }}/bin/vector"
  handlers:
    - name: Restart Vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
        daemon_reload: true
      when: not ansible_check_mode
  tasks:
    - name: Ensure Vector service group exists
      ansible.builtin.group:
        name: vector
        system: true

    - name: Ensure Vector service user exists
      ansible.builtin.user:
        name: vector
        group: vector
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/vector
        create_home: false

    - name: Ensure Vector directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/vector, owner: root, group: root, mode: "0755" }
        - { path: /etc/vector, owner: root, group: root, mode: "0755" }
        - { path: /var/lib/vector, owner: vector, group: vector, mode: "0750" }

    - name: Download Vector archive
      ansible.builtin.get_url:
        url: "{{ vector_download_url }}"
        dest: "{{ vector_archive }}"
        mode: "0644"
      when: not ansible_check_mode

    - name: Extract Vector archive
      ansible.builtin.unarchive:
        src: "{{ vector_archive }}"
        dest: /opt/vector
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: "{{ vector_extracted_binary }}"
      when: not ansible_check_mode

    - name: Link Vector binary into PATH
      ansible.builtin.file:
        src: "{{ vector_extracted_binary }}"
        dest: /usr/local/bin/vector
        state: link
      when: not ansible_check_mode

    - name: Deploy Vector configuration
      ansible.builtin.template:
        src: templates/vector.yaml.j2
        dest: /etc/vector/vector.yaml
        owner: root
        group: vector
        mode: "0640"
      notify: Restart Vector

    - name: Deploy Vector systemd unit
      ansible.builtin.template:
        src: templates/vector.service.j2
        dest: /etc/systemd/system/vector.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Vector

    - name: Ensure Vector is enabled and started
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

- name: Install and configure LightHouse
  hosts: lighthouse
  become: true
  tags:
    - lighthouse
  vars:
    lighthouse_archive: "/tmp/lighthouse-{{ lighthouse_commit }}.zip"
    lighthouse_web_root: "/var/www/lighthouse-{{ lighthouse_commit }}"
  handlers:
    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        daemon_reload: true
      when: not ansible_check_mode
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name:
          - nginx
          - unzip
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: not ansible_check_mode

    - name: Download pinned LightHouse static archive
      ansible.builtin.get_url:
        url: "{{ lighthouse_archive_url }}"
        dest: "{{ lighthouse_archive }}"
        mode: "0644"
      when: not ansible_check_mode

    - name: Extract LightHouse static files
      ansible.builtin.unarchive:
        src: "{{ lighthouse_archive }}"
        dest: /var/www
        remote_src: true
        creates: "{{ lighthouse_web_root }}/index.html"
      when: not ansible_check_mode

    - name: Deploy Nginx LightHouse site configuration
      ansible.builtin.template:
        src: templates/lighthouse.nginx.conf.j2
        dest: /etc/nginx/sites-available/lighthouse
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx

    - name: Enable LightHouse Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/lighthouse
        dest: /etc/nginx/sites-enabled/lighthouse
        state: link
      notify: Restart Nginx
      when: not ansible_check_mode

    - name: Disable the default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      when: not ansible_check_mode

    - name: Ensure Nginx is enabled and started
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
